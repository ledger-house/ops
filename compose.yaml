name: ledger-house

services:
  postgres:
    image: postgres:18.6
    container_name: ledger-house-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d ledger_house"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    container_name: ledger-house-redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "19644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.10.0
    container_name: ledger-house-redpanda-console

    depends_on:
      redpanda:
        condition: service_healthy

    environment:
      CONFIG_FILEPATH: /etc/redpanda-console/config.yaml

    volumes:
      - ./redpanda/console-config.yaml:/etc/redpanda-console/config.yaml:ro

    ports:
      - "8090:8080"
  dozzle:
    image: amir20/dozzle:v10.6.14
    container_name: ledger-house-dozzle

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    ports:
      - "9999:8080"

    environment:
      DOZZLE_HOSTNAME: ledger-house

volumes:
  postgres_data:
